<form (submit)="submit($event)" [formGroup]="registreerPersoonForm">
  <label for="skn">Strafrechtketennummer:</label>
  <input
    type="text"
    name="skn"
    id="skn"
    required
    aria-describedby="skn-error-message"
    formControlName="skn"
  />
  @if (sknControl.invalid && sknControl.touched) {
    <p id="skn-error-message">Ongeldige invoer voor strafrechtketennummer.</p>
  }

  <label for="bsn">Burgerservicenummer:</label>
  <input
    type="text"
    name="bsn"
    id="bsn"
    required
    aria-describedby="bsn-error-message"
    formControlName="bsn"
  />
  @if (bsnControl.invalid && bsnControl.touched) {
    <p id="bsn-error-message">Ongeldige invoer voor burgerservicenummer.</p>
  }

  <button type="submit" [disabled]="registreerPersoonForm.invalid">Verstuur</button>

  @if (isSent) {
    <div class="success-message">Persoon succesvol geregistreerd!</div>
  }
</form>
